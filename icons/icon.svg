<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bg)"/>

  <!-- Subtle inner glow -->
  <rect x="8" y="8" width="112" height="112" rx="20" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Document card -->
  <rect x="24" y="18" width="80" height="92" rx="6" fill="url(#card)" opacity="0.95"/>

  <!-- Card shadow -->
  <rect x="26" y="20" width="80" height="92" rx="6" fill="rgba(0,0,0,0.08)" opacity="0.3"/>

  <!-- Document -->
  <rect x="24" y="18" width="80" height="92" rx="6" fill="url(#card)"/>

  <!-- Header bar at top of document -->
  <rect x="24" y="18" width="80" height="22" rx="6" fill="#6366f1" opacity="0.9"/>
  <rect x="24" y="34" width="80" height="6" fill="#6366f1" opacity="0.9"/>

  <!-- "H" letter in header bar -->
  <text x="64" y="35" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="white" text-anchor="middle">H</text>

  <!-- Header key-value lines -->
  <!-- Line 1 -->
  <rect x="32" y="48" width="22" height="4" rx="2" fill="#6366f1" opacity="0.7"/>
  <rect x="58" y="48" width="38" height="4" rx="2" fill="#94a3b8" opacity="0.5"/>

  <!-- Line 2 -->
  <rect x="32" y="58" width="18" height="4" rx="2" fill="#6366f1" opacity="0.7"/>
  <rect x="54" y="58" width="42" height="4" rx="2" fill="#94a3b8" opacity="0.5"/>

  <!-- Line 3 -->
  <rect x="32" y="68" width="26" height="4" rx="2" fill="#6366f1" opacity="0.7"/>
  <rect x="62" y="68" width="30" height="4" rx="2" fill="#94a3b8" opacity="0.5"/>

  <!-- Line 4 -->
  <rect x="32" y="78" width="14" height="4" rx="2" fill="#6366f1" opacity="0.7"/>
  <rect x="50" y="78" width="44" height="4" rx="2" fill="#94a3b8" opacity="0.5"/>

  <!-- Arrow overlay — request/response concept -->
  <path d="M 72 88 L 88 88 L 84 84 M 88 88 L 84 92" stroke="#6366f1" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M 88 96 L 72 96 L 76 92 M 72 96 L 76 100" stroke="#6366f1" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- Small tab icon (tab isolation concept) -->
  <rect x="72" y="84" width="24" height="18" rx="3" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
  <rect x="72" y="84" width="10" height="5" rx="2" fill="#6366f1" opacity="0.3"/>
</svg>
