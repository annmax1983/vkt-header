<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vkt-header - Support</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: #1e1e2e; color: #cdd6f4; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #181825; border: 1px solid #313244; border-radius: 16px; max-width: 600px; width: 100%; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    .banner { background: linear-gradient(135deg, #1e1e2e, #313244); padding: 40px 32px 32px; text-align: center; }
    .banner-icon { font-size: 48px; margin-bottom: 12px; }
    .banner h1 { font-size: 28px; margin-bottom: 8px; background: linear-gradient(135deg, #fb923c, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .banner p { color: #a6adc8; font-size: 14px; }
    .body { padding: 28px 32px; }
    .body h2 { font-size: 16px; color: #fb923c; margin-bottom: 14px; }
    .body ul { list-style: none; padding: 0; margin-bottom: 20px; }
    .body li { padding: 6px 0; font-size: 14px; color: #bac2de; border-bottom: 1px solid #1e1e2e; }
    .body li:last-child { border-bottom: none; }
    .body li::before { content: '✓ '; color: #fb923c; }
    .thank { margin-top: 20px; }
    .thank p { font-size: 14px; color: #bac2de; line-height: 1.7; margin-bottom: 10px; }
    .heart { color: #f38ba8; }
    .cta { text-align: center; padding: 20px 32px 28px; border-top: 1px solid #313244; }
    .cta p { font-size: 13px; color: #6c7086; margin-bottom: 14px; }
    .support-btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; background: linear-gradient(135deg, #fb923c, #f97316); color: #fff; border-radius: 8px; font-size: 15px; font-weight: 600; text-decoration: none; transition: transform 0.15s, box-shadow 0.15s; }
    .support-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(251,146,60,0.3); }
    .footer { padding: 16px 32px; text-align: center; font-size: 12px; color: #6c7086; border-top: 1px solid #1e1e2e; }
    .footer a { color: #fb923c; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="banner">
      <div class="banner-icon">🔧</div>
      <h1>vkt-header</h1>
      <p data-i18n="tagline"></p>
    </div>
    <div class="body">
      <h2 data-i18n="featuresTitle"></h2>
      <ul id="featureList"></ul>
      <h2 data-i18n="thankTitle"></h2>
      <div class="thank" id="thankText"></div>
    </div>
    <div class="cta">
      <p data-i18n="ctaHint"></p>
      <a class="support-btn" href="https://ko-fi.com/annmax?ref=vkt-header" target="_blank" rel="noopener">
        <img src="./assets/coffee.png" alt="" width="28" height="22" style="vertical-align:middle"> <span data-i18n="btnText"></span>
      </a>
    </div>
    <div class="footer">
      <a href="https://gitee.com/xinsiyu/vkt-header" target="_blank" rel="noopener">Gitee</a> ·
      <a href="https://annmax1983.github.io/vkt-header/privacy-policy.html" target="_blank" rel="noopener" data-i18n="privacyPolicy">Privacy</a> ·
      Copyright © 2026 vkt-header
    </div>
  </div>
  <script>
    const I18N = {
      zh: { tagline: '标签页隔离 · HTTP请求头模拟修改工具', featuresTitle: '✨ 功能特色', features: ['Header修改严格隔离在当前标签页，不影响其他页面', '关闭标签页自动撤销修改，不留残留', '保存多套请求头快照模板，一键复用', '可绑定URL，打开对应页面自动提示', '会话规则，浏览器重启自动清除，安全无忧', '支持6种语言，自动匹配浏览器语言'], thankTitle: '💌 想对你说', thank: ['感谢你使用 vkt-header。做这个工具是因为现有Header修改插件全局生效太危险，容易误篡改线上环境。', '如果它也帮到了你，那对我来说就是最好的回报。', '当然，如果你愿意请我喝一杯咖啡 <span class="heart">☕</span>，我会非常开心。'], ctaHint: '点击下方按钮，跳转到支持页面', btnText: 'Support My Work', privacyPolicy: '隐私条款' },
      en: { tagline: 'Tab-Isolated HTTP Header Modifier', featuresTitle: '✨ Features', features: ['Header changes strictly isolated to current tab', 'Auto-cleanup when tab closes, no residual rules', 'Save multiple header snapshot templates, one-click reuse', 'Optional URL binding, auto-suggest on matching pages', 'Session rules auto-clear on browser restart', '6 languages, auto-detected from browser'], thankTitle: '💌 A Note to You', thank: ['Thank you for using vkt-header. I built this because existing header modifiers apply globally, risking accidental production contamination.', 'If it helps you too, that\'s already the best reward.', 'Of course, if you\'d like to <span class="heart">☕</span> buy me a coffee, it would truly make my day.'], ctaHint: 'Click below to visit the support page', btnText: 'Support My Work', privacyPolicy: 'Privacy' },
      ja: { tagline: 'タブ分離型 HTTPヘッダー変更ツール', featuresTitle: '✨ 機能', features: ['ヘッダー変更は現在のタブに厳密に分離', 'タブ閉鎖で自動クリア、残留ルールなし', 'テンプレート保存・ワンクリック再利用', 'URLバインド、該当ページで自動提案', 'セッションルール、ブラウザ再起動で自動消去', '6言語対応'], thankTitle: '💌 ご利用ありがとうございます', thank: ['vkt-headerをご利用いただきありがとうございます。既存のヘッダー変更ツールがグローバル生效する問題を解決するために作りました。', 'お役に立てれば幸いです。', 'コーヒーを <span class="heart">☕</span> 一杯おごっていただけると嬉しいです。'], ctaHint: 'サポートページへ', btnText: 'Support My Work', privacyPolicy: 'プライバシー' },
      de: { tagline: 'Tab-isolierter HTTP-Header-Modifier', featuresTitle: '✨ Funktionen', features: ['Header-Änderungen streng isoliert auf aktuellen Tab', 'Auto-Bereinigung beim Tab-Schließen', 'Mehrere Vorlagen speichern und wiederverwenden', 'URL-Bindung mit Auto-Vorschlag', 'Session-Regeln beim Neustart gelöscht', '6 Sprachen'], thankTitle: '💌 Danke', thank: ['Vielen Dank für vkt-header. Ich habe es gebaut, weil existierende Tools global ändern.', 'Freut mich, wenn es hilft.', 'Ein <span class="heart">☕</span> Kaffee würde mich sehr freuen.'], ctaHint: 'Zur Support-Seite', btnText: 'Support My Work', privacyPolicy: 'Datenschutz' },
      es: { tagline: 'Modificador HTTP aislado por pestaña', featuresTitle: '✨ Características', features: ['Cambios aislados en la pestaña actual', 'Limpieza automática al cerrar pestaña', 'Múltiples plantillas, reutilización con un clic', 'Vinculación URL con sugerencia automática', 'Reglas de sesión se limpian al reiniciar', '6 idiomas'], thankTitle: '💌 Gracias', thank: ['Gracias por usar vkt-header.', 'Si te ayuda, es la mejor recompensa.', 'Un <span class="heart">☕</span> café me haría muy feliz.'], ctaHint: 'Ir a soporte', btnText: 'Support My Work', privacyPolicy: 'Privacidad' },
      fr: { tagline: 'Modificateur d\'en-têtes HTTP isolé par onglet', featuresTitle: '✨ Fonctionnalités', features: ['Modifications isolées sur l\'onglet actuel', 'Nettoyage automatique à la fermeture', 'Plusieurs modèles, réutilisation en un clic', 'Liaison URL avec suggestion automatique', 'Règles de session effacées au redémarrage', '6 langues'], thankTitle: '💌 Merci', thank: ['Merci d\'utiliser vkt-header.', 'S\'il vous aide, c\'est la meilleure récompense.', 'Un <span class="heart">☕</span> café me ferait très plaisir.'], ctaHint: 'Page de soutien', btnText: 'Support My Work', privacyPolicy: 'Confidentialité' }
    };
    function detectLang() { const c = (navigator.language || 'en').split('-')[0].toLowerCase(); return I18N[c] ? c : 'en'; }
    function applyLang(lang) { const t = I18N[lang]; document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.getAttribute('data-i18n'); if (t[k]) el.textContent = t[k]; }); document.getElementById('featureList').innerHTML = t.features.map(f => `<li>${f}</li>`).join(''); document.getElementById('thankText').innerHTML = t.thank.map(p => `<p>${p}</p>`).join(''); document.documentElement.lang = lang; }
    applyLang(detectLang());
  </script>
</body>
</html>
