<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vkt-header - Support</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: #1e1e2e; color: #cdd6f4; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #181825; border: 1px solid #313244; border-radius: 16px; max-width: 600px; width: 100%; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    .banner { background: linear-gradient(135deg, #1e1e2e, #313244); padding: 40px 32px 32px; text-align: center; }
    .banner-icon { font-size: 48px; margin-bottom: 12px; }
    .banner h1 { font-size: 28px; margin-bottom: 8px; background: linear-gradient(135deg, #fb923c, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .banner p { color: #a6adc8; font-size: 14px; }
    .body { padding: 28px 32px; }
    .body h2 { font-size: 16px; color: #fb923c; margin-bottom: 14px; }
    .body ul { list-style: none; padding: 0; margin-bottom: 20px; }
    .body li { padding: 6px 0; font-size: 14px; color: #bac2de; border-bottom: 1px solid #1e1e2e; }
    .body li:last-child { border-bottom: none; }
    .body li::before { content: '✓ '; color: #fb923c; }
    .thank { margin-top: 20px; }
    .thank p { font-size: 14px; color: #bac2de; line-height: 1.7; margin-bottom: 10px; }
    .heart { color: #f38ba8; }
    .cta { text-align: center; padding: 20px 32px 28px; border-top: 1px solid #313244; }
    .cta p { font-size: 13px; color: #6c7086; margin-bottom: 14px; }
    .support-btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; background: linear-gradient(135deg, #fb923c, #f97316); color: #fff; border-radius: 8px; font-size: 15px; font-weight: 600; text-decoration: none; transition: transform 0.15s, box-shadow 0.15s; }
    .support-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(251,146,60,0.3); }
    .footer { padding: 16px 32px; text-align: center; font-size: 12px; color: #6c7086; border-top: 1px solid #1e1e2e; }
    .footer a { color: #fb923c; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="banner">
      <div class="banner-icon">🔧</div>
      <h1>vkt-header</h1>
      <p data-i18n="tagline"></p>
    </div>
    <div class="body">
      <h2 data-i18n="featuresTitle"></h2>
      <ul id="featureList"></ul>
      <h2 data-i18n="thankTitle"></h2>
      <div class="thank" id="thankText"></div>
    </div>
    <div class="cta">
      <p data-i18n="ctaHint"></p>
      <a class="support-btn" href="https://ko-fi.com/annmax?ref=vkt-header" target="_blank" rel="noopener">
        <img src="./assets/coffee.png" alt="" width="28" height="22" style="vertical-align:middle"> <span data-i18n="btnText"></span>
      </a>
    </div>
    <div class="footer">
      <a href="https://github.com/annmax1983/vkt-header" target="_blank" rel="noopener">GitHub</a> ·
      <a href="https://annmax1983.github.io/vkt-header/privacy-policy.html" target="_blank" rel="noopener" data-i18n="privacyPolicy">Privacy</a> ·
      Copyright © 2026 vkt-header
    </div>
  </div>
  <script>
    const I18N = {
      zh: { tagline: '按域名匹配 · HTTP请求头修改工具', featuresTitle: '✨ 功能特色', features: ['规则按域名匹配（忽略大小写），对所有标签页生效', '域名留空即对所有请求生效', '保存多套请求头规则，每条可独立启用/停用', '浏览器重启后自动重新应用已启用规则', '会话规则，浏览器重启自动清除，安全无忧'], thankTitle: '💌 想对你说', thank: ['感谢你使用 vkt-header。做这个工具是因为现有Header修改插件全局生效太危险，容易误篡改线上环境。', '如果它也帮到了你，那对我来说就是最好的回报。', '当然，如果你愿意请我喝一杯咖啡 <span class="heart">☕</span>，我会非常开心。'], ctaHint: '点击下方按钮，跳转到支持页面', btnText: 'Support My Work', privacyPolicy: '隐私条款' },
      en: { tagline: 'Domain-Matched HTTP Header Modifier', featuresTitle: '✨ Features', features: ['Rules match by domain, case-insensitive, in every tab', 'Empty domain = applies to all requests', 'Save multiple header rules, enable each independently', 'Enabled rules re-apply automatically on browser start', 'Session rules auto-clear on browser restart', ], thankTitle: '💌 A Note to You', thank: ['Thank you for using vkt-header. I built this because existing header modifiers apply globally, risking accidental production contamination.', 'If it helps you too, that\'s already the best reward.', 'Of course, if you\'d like to <span class="heart">☕</span> buy me a coffee, it would truly make my day.'], ctaHint: 'Click below to visit the support page', btnText: 'Support My Work', privacyPolicy: 'Privacy' },
      ja: { tagline: 'ドメインマッチ型 HTTPヘッダー変更ツール', featuresTitle: '✨ 機能', features: ['ルールはドメインでマッチ（大文字小文字を区別せず）、全タブに適用', 'ドメインを空にすると全リクエストに適用', '複数のルールを保存し、個別に有効/無効化', '有効なルールはブラウザ起動時に自動再適用', 'セッションルール、ブラウザ再起動で自動消去'], thankTitle: '💌 ご利用ありがとうございます', thank: ['vkt-headerをご利用いただきありがとうございます。既存のヘッダー変更ツールがグローバル生效する問題を解決するために作りました。', 'お役に立てれば幸いです。', 'コーヒーを <span class="heart">☕</span> 一杯おごっていただけると嬉しいです。'], ctaHint: 'サポートページへ', btnText: 'Support My Work', privacyPolicy: 'プライバシー' },
      de: { tagline: 'Domain-basierter HTTP-Header-Modifier', featuresTitle: '✨ Funktionen', features: ['Regeln matchen per Domain (ohne Groß-/Kleinschreibung), in jedem Tab', 'Leere Domain = gilt für alle Anfragen', 'Mehrere Regeln speichern, einzeln aktivierbar', 'Aktivierte Regeln werden beim Start automatisch neu angewendet', 'Session-Regeln beim Neustart gelöscht'], thankTitle: '💌 Danke', thank: ['Vielen Dank für vkt-header. Ich habe es gebaut, weil existierende Tools global ändern.', 'Freut mich, wenn es hilft.', 'Ein <span class="heart">☕</span> Kaffee würde mich sehr freuen.'], ctaHint: 'Zur Support-Seite', btnText: 'Support My Work', privacyPolicy: 'Datenschutz' },
      es: { tagline: 'Modificador HTTP por dominio', featuresTitle: '✨ Características', features: ['Las reglas coinciden por dominio (sin mayúsculas), en cada pestaña', 'Dominio vacío = se aplica a todas las peticiones', 'Guarda múltiples reglas, activa cada una', 'Las reglas activas se reaplican al iniciar', 'Reglas de sesión se limpian al reiniciar'], thankTitle: '💌 Gracias', thank: ['Gracias por usar vkt-header.', 'Si te ayuda, es la mejor recompensa.', 'Un <span class="heart">☕</span> café me haría muy feliz.'], ctaHint: 'Ir a soporte', btnText: 'Support My Work', privacyPolicy: 'Privacidad' },
      fr: { tagline: 'Modificateur d\'en-têtes HTTP par domaine', featuresTitle: '✨ Fonctionnalités', features: ['Règles correspondant par domaine (sans casse), chaque onglet', 'Domaine vide = s\'applique à toutes les requêtes', 'Enregistre plusieurs règles, activation individuelle', 'Les règles actives se réappliquent au démarrage', 'Règles de session effacées au redémarrage'], thankTitle: '💌 Merci', thank: ['Merci d\'utiliser vkt-header.', 'S\'il vous aide, c\'est la meilleure récompense.', 'Un <span class="heart">☕</span> café me ferait très plaisir.'], ctaHint: 'Page de soutien', btnText: 'Support My Work', privacyPolicy: 'Confidentialité' }
    };
    function detectLang() { const c = (navigator.language || 'en').split('-')[0].toLowerCase(); return I18N[c] ? c : 'en'; }
    function applyLang(lang) { const t = I18N[lang]; document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.getAttribute('data-i18n'); if (t[k]) el.textContent = t[k]; }); document.getElementById('featureList').innerHTML = t.features.map(f => `<li>${f}</li>`).join(''); document.getElementById('thankText').innerHTML = t.thank.map(p => `<p>${p}</p>`).join(''); document.documentElement.lang = lang; }
    applyLang(detectLang());
  </script>
</body>
</html>
